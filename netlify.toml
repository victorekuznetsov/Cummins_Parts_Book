# Публикация офлайн-каталога запчастей Cummins на Netlify.
# Сайт статический (index.html + *.js + картинки), сборки не требует.
[build]
  publish = "catalog"
  command = ""

# Разметку/стили/скрипты не кэшируем — чтобы обновления каталога и правки
# появлялись сразу (иначе Safari держит старый styles.css до истечения кэша).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Картинки деталей и чертежей неизменны для данного ESN — кэшируем на сутки.
[[headers]]
  for = "/drawings/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/parts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
